name: Finalizar Biblioteca
on:
  push:
    paths:
      - '.github/workflows/sync-biblioteca.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruir atualização
        shell: bash
        run: |
          cat .sync/payload00 .sync/payload01 .sync/payload02 .sync/payload03 .sync/payload04 > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.zip
          unzip -o /tmp/payload.zip -d .
          rm -rf .sync
          git config user.name "renancodando"
          git config user.email "renancodando@users.noreply.github.com"
          git add -A
          git commit -m "Eleva Biblioteca do Cérebro ao modo anatômico avançado"
          git push
